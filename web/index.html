<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Painel de Indicadores de Produção e Performance Industrial Zaraplast">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Indicadores Zaraplast">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Indicadores Zaraplast — Corte & Rebobinamento</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #060B16;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading-logo-box {
      width: 64px;
      height: 64px;
      background: #0B172B;
      border: 1.5px solid #1E3A68;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
    }
    .loading-logo-box img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .sheen {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: sweep 2s infinite;
    }
    @keyframes sweep {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: #0284C7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-logo-box">
      <img src="favicon.png" alt="Zaraplast Logo">
      <div class="sheen"></div>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Carregando Indicadores Zaraplast...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            const loader = document.getElementById('loading');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
